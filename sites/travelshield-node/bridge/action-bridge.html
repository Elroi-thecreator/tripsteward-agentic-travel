<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Action Bridge - travelshield_underwriter</title>
    <script type="importmap">
    {
      "imports": {
        "open-agentic-web": "https://esm.sh/open-agentic-web@1.1.5",
        "open-agentic-web/": "https://esm.sh/open-agentic-web@1.1.5/"
      }
    }
    </script>
    <script type="module">
      import { createActionRegistry, setupActionBridge, createConsentDialog } from "open-agentic-web";
      import { SiteActions } from "../site-actions.js";

      const registry = createActionRegistry();
      SiteActions.registerActions(registry);

      setupActionBridge({
        registry,
        allowedOrigins: ["*"],
        onConfirm: async ({ action, arguments: args, origin }) => {
          return createConsentDialog({
            title: "TravelShield Action Authorization",
            message: `${origin} is requesting permission to execute '${action}'.`,
            details: args,
            confirmText: "Authorize Action",
            cancelText: "Decline"
          });
        }
      });
    </script>
  </head>
  <body>
    <h3>Action Bridge for travelshield_underwriter</h3>
  </body>
</html>
